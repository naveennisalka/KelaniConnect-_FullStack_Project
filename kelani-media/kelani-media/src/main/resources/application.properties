spring.application.name=kelani-media

# MongoDB Configuration
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/kelani_connect}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/kelani_connect}
spring.mongodb.database=${MONGODB_DATABASE:kelani_connect}
spring.data.mongodb.database=${MONGODB_DATABASE:kelani_connect}

# JWT Configuration
app.jwt.secret=${JWT_SECRET:KelaniConnectSecretKey2024VeryLongSecretKeyForJWTTokenGeneration}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# Server Configuration
server.port=${SERVER_PORT:8080}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
